name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python 3.14
      - run: uv run ruff check
      - run: uv run ty check
      - run: uv run python -m pytest
  core-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.14 /tmp/core && uv pip install --python /tmp/core/bin/python .
      - run: /tmp/core/bin/python -c "import headgate, headgate.msgspec; from headgate import AsyncBaseClient"
