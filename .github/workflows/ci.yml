name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read # checkout only

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, format and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.0"
          python-version: "3.14"
      - run: uv lock --check
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run ty check
      - run: uv run typos

  test:
    # The required check names are "Tests and coverage (<os>)", so the Python 3.15 entry gets a name of its own.
    name: Tests and coverage (${{ matrix.os }}${{ matrix.experimental && ', Python 3.15' || '' }})
    runs-on: ${{ matrix.os }}
    # Python 3.15 may fail until the suite and its dependencies support it; it never blocks a merge.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.14"]
        include:
          - os: ubuntu-latest
            python: "3.15"
            experimental: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.0"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run python -m pytest --cov --cov-report=term-missing

  lowest-dependencies:
    name: Tests at the lowest declared dependencies
    runs-on: ubuntu-latest
    env:
      # Every uv command resolves and syncs at the floors; without it, `uv run` re-syncs to the lockfile's highest versions.
      UV_RESOLUTION: lowest-direct
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.0"
          python-version: "3.14"
      # The lockfile pins the highest versions; resolve afresh so uv has no lockfile to ignore.
      - run: rm uv.lock
      - run: uv sync
      - run: uv run python -m pytest

  core-only:
    name: Install without extras
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.0"
          python-version: "3.14"
      - run: uv venv "$RUNNER_TEMP/core" && uv pip install --python "$RUNNER_TEMP/core/bin/python" .
      - run: >-
          "$RUNNER_TEMP/core/bin/python" -c
          "import headgate, headgate.health, headgate.policy; from headgate import AsyncBaseClient, Codec"
      # No codec comes with the core: without its extra, the msgspec codec fails naming the extra to install.
      - run: |
          out=$("$RUNNER_TEMP/core/bin/python" -c "import headgate.msgspec" 2>&1) && exit 1
          grep -q 'pip install headgate\[msgspec\]' <<<"$out"
      - run: uv pip install --python "$RUNNER_TEMP/core/bin/python" ".[msgspec]"
      - run: '"$RUNNER_TEMP/core/bin/python" -c "import headgate.msgspec"'

  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.0"
      - run: uv audit --frozen --preview-features audit-command

  zizmor:
    name: Workflow security audit
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: "1.32.0"
          # Findings fail this check; SARIF mode would exit 0 and leave them to code scanning, which is not required.
          advanced-security: false

  benchmarks-smoke:
    name: Benchmarks run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.0"
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run python -m pytest benchmarks

  benchmarks:
    # CPU-simulation and allocation measurements, compared against main on every pull request. Enable by installing
    # the CodSpeed GitHub app for this repository and setting the repository variable CODSPEED_ENABLED=true.
    if: vars.CODSPEED_ENABLED == 'true'
    name: Benchmarks (CodSpeed)
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      id-token: write # tokenless CodSpeed upload for a public repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.0"
          python-version: "3.14"
      - run: uv sync --locked
      - uses: CodSpeedHQ/action@61efe07e57e55bedeab750c434504de272a56e8c # v5.6.1
        with:
          mode: simulation,memory
          run: uv run python -m pytest benchmarks --codspeed
