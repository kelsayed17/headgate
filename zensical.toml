# The documentation site, built from docs/ by Zensical (`uv run --only-group docs zensical serve` to preview it).

[project]
site_name = "headgate"
site_description = "An async API-client base for Python on httpx2"
site_url = "https://kelsayed17.github.io/headgate/"
repo_url = "https://github.com/kelsayed17/headgate"
repo_name = "kelsayed17/headgate"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2026 Khaled Elsayed. MIT licence."
extra_css = ["stylesheets/extra.css"]

nav = [
  { "Home" = "index.md" },
  { "Why headgate" = [
    { "Compared with others" = "comparison.md" },
    { "Security" = "security.md" },
    { "Standards" = "standards.md" },
  ] },
  { "Guides" = [
    "configuration.md",
    "responses.md",
    "errors.md",
    "retries.md",
    "deadlines.md",
    "rate-budgets.md",
    "breaker.md",
    "caching.md",
    "auth.md",
    "pagination.md",
    "streaming.md",
    "observability.md",
    "testing.md",
  ] },
  { "Project" = [
    "design.md",
    "mutation-testing.md",
    { "Changelog" = "https://github.com/kelsayed17/headgate/blob/main/CHANGELOG.md" },
    { "PyPI" = "https://pypi.org/project/headgate/" },
  ] },
]

[project.theme]
language = "en"
logo = "assets/logo.png"
favicon = "assets/logo.png"
features = [
  "content.action.edit",
  "content.code.copy",
  "navigation.footer",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight = {}
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
